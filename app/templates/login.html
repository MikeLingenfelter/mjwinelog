{% extends "base.html" %}

{% block title %}Login - Wine Tracker{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 9vh auto 0;">
    <div class="card" style="padding: 2.5rem 2.25rem; text-align: center;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🍷</div>
        <h2 style="margin-bottom: 0.35rem;">Welcome back</h2>
        <p style="color: var(--ink-soft); font-size: 0.92rem; margin-bottom: 1.75rem;">
            Sign in to your cellar journal
        </p>

        <form method="POST" style="text-align: left;">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 0.5rem;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
